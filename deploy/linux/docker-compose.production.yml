services:
  t8-penguin-canvas:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: t8-penguin-canvas:production
    container_name: t8-penguin-canvas
    restart: unless-stopped
    ports:
      - "127.0.0.1:18766:18766"
    # Allow the container to reach services running on the ECS host (AList).
    # `host.docker.internal` is intentionally not exposed outside Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env.production
    environment:
      HOST: 0.0.0.0
      PORT: 18766
      NODE_ENV: production
      T8PC_PACKAGED: "1"
      T8PC_FRONTEND_DIST: /app/dist
      T8PC_USER_DATA: /app/userdata
      HOME: /app/userdata
      T8PC_COOKIE_SECURE: "1"
    volumes:
      - /srv/t8-penguin-canvas/userdata:/app/userdata
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:18766/api/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  alist:
    image: ${ALIST_IMAGE:-xhofe/alist:latest}
    container_name: t8-alist
    profiles: ["baidu"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5244:5244"
    volumes:
      - /srv/t8-alist:/opt/alist/data
